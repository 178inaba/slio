name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # No separate build step for the host platform: go test compiles every
      # matched package, including ones without test files (the root
      # main.go), so a compile failure there fails this step too.
      - run: go test -race ./...
      # That reasoning stops at files built for another GOOS. Nothing else
      # compiles the Windows half of the re-raise pair, and the release
      # builds Windows archives, so a break there would only surface once
      # the tag is already pushed and GoReleaser is running.
      - run: GOOS=windows go build ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Break one of the four facts below and nothing goes red: this
      # workflow passes, the release job succeeds, and the first signal is a
      # user whose skill has drifted from their binary — behind it when the
      # plugin stops updating, ahead of it when the README install command
      # loses its ref. Bare semver is this repository's own rule — a lost
      # version falls back to the resolved commit SHA, and a hand-written
      # v1.0.2 desyncs from the tag tagpr looks for.
      - name: Assert the plugin distribution invariants
        run: |
          version=$(jq -r '.version // ""' .claude-plugin/plugin.json)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::.claude-plugin/plugin.json needs a bare semver version (got '$version')"; exit 1; }
          jq -e '.plugins[0] | has("version") | not' .claude-plugin/marketplace.json >/dev/null \
            || { echo "::error::the .claude-plugin/marketplace.json plugins entry must not carry a version, which would let a stale plugin.json mask it"; exit 1; }
          jq -e '.plugins[0].source | type == "object" and .ref == "stable"' .claude-plugin/marketplace.json >/dev/null \
            || { echo "::error::the .claude-plugin/marketplace.json plugins entry must resolve through source.ref \"stable\""; exit 1; }
          grep -qF 'npx skills add https://github.com/178inaba/slio/tree/stable' README.md \
            || { echo "::error::README.md's npx skills install command must name the stable tag in URL form (the 178inaba/slio@stable shorthand does not survive an update)"; exit 1; }
      # golangci-lint-action resolves an empty tag — and a `latest` tag — to
      # whatever the newest release is, so a compose.yaml that lost its pin
      # would leave this job green and silently unpinned. Any other malformed
      # value already makes the action throw. This needs nothing but the
      # checkout, so it runs before the toolchain install.
      - name: Read the golangci-lint version from compose.yaml
        id: version
        run: |
          image=$(yq '.services.lint.image' compose.yaml)
          version=${image##*:}
          [[ "$version" == v* ]] || { echo "::error::could not read the golangci-lint version from compose.yaml (got '$version')"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Required by golangci-lint-action, and the Go problem matcher it
      # registers is what turns findings into inline PR annotations.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ steps.version.outputs.version }}
      # Same constraint as the release workflow uses, so what passes here is
      # what will run there — a broken .goreleaser.yaml is otherwise only
      # found after the tag has been pushed.
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: check
